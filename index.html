<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">

<title>Codificador de Prestaciones</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f4f6;
  color:#111827;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

main{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin:12px 0;
  box-shadow:0 3px 15px #0001;
}

h1{
  font-size:24px;
  margin:0;
}

h2{
  margin-top:0;
}

.muted{
  color:#6b7280;
}

.small{
  color:#6b7280;
  font-size:13px;
}

input[type=file]{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:12px;
  background:#fff;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 16px;
  background:#111827;
  color:white;
  font-weight:750;
  font-size:15px;
  margin-top:10px;
  width:100%;
  cursor:pointer;
}

button.secondary{
  background:#e5e7eb;
  color:#111827;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.status{
  padding:12px;
  border-radius:12px;
  background:#f9fafb;
  margin-top:12px;
  white-space:pre-wrap;
}

.ok{
  background:#ecfdf5;
  color:#065f46;
}

.warn{
  background:#fffbeb;
  color:#92400e;
}

.err{
  background:#fef2f2;
  color:#991b1b;
}

.item{
  padding:14px 0;
  border-bottom:1px solid #e5e7eb;
}

.item:last-child{
  border-bottom:0;
}

.code{
  font-weight:900;
  font-size:16px;
}

.badge{
  display:inline-block;
  padding:3px 8px;
  border-radius:999px;
  background:#eef2ff;
  font-size:12px;
  font-weight:800;
}

.counter{
  margin-top:10px;
  padding:12px;
  background:#f3f4f6;
  border-radius:12px;
  font-weight:700;
}

.warning-box{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#fffbeb;
  color:#92400e;
}

.success-box{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#ecfdf5;
  color:#065f46;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

</head>

<body>

<main>

<section class="card">

<h1>Codificador de Prestaciones</h1>

<div class="muted">
Nomenclador Mendoza · Marzo 2026
</div>

</section>


<section class="card">

<b>Seleccioná el estudio médico en PDF</b>

<input
  id="pdf"
  type="file"
  accept="application/pdf"
  style="margin-top:10px"
>

<button onclick="analizar()">
ANALIZAR ESTUDIO
</button>

<button
  class="secondary"
  onclick="limpiar()"
>
LIMPIAR
</button>

<div id="status" class="status">
Esperando PDF…
</div>

</section>


<section
  id="resultado"
  class="card"
  style="display:none"
>

<h2>Resultado</h2>

<div id="aviso"></div>

<div id="contador"></div>

<div id="lista"></div>

<button
  id="generar"
  onclick="generarPDF()"
>
GENERAR PDF CODIFICADO
</button>

</section>

</main>

   REGLAS ESPECIALES CONFIRMADAS
   ========================================================= */

const EQUIVALENCIAS = {

"GLUCOSA EN SUERO":{
  description:"Glucemia (c/u)",
  code:"LAB.01.073",
  confidence:"CONFIRMADA"
},

"GLUCEMIA":{
  description:"Glucemia (c/u)",
  code:"LAB.01.073",
  confidence:"CONFIRMADA"
}

};


/* =========================================================
   ACTO BIOQUÍMICO
   ========================================================= */

const ACTO_BIOQUIMICO = {
  description:"Acto Bioquímico",
  code:"LAB.00.001",
  confidence:"REGLA"
};


/* =========================================================
   VARIABLES
   ========================================================= */

let sourceBytes = null;

let sourceName = "ESTUDIO.pdf";

let detections = [];

let pdfPages = 0;


/* =========================================================
   NORMALIZACIÓN
   ========================================================= */

function norm(text){

  return String(text || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toUpperCase()
    .replace(/[^A-Z0-9Ñ\s.,()\/\-]/g," ")
    .replace(/\s+/g," ")
    .trim();

}


/* =========================================================
   TOKENIZACIÓN
   ========================================================= */

function tokens(text){

  return norm(text)
    .split(/[\s,.;:()\/\-]+/)
    .filter(x => x.length > 1);

}


/* =========================================================
   SIMILITUD
   ========================================================= */

function similarity(a,b){

  const A = new Set(tokens(a));

  const B = new Set(tokens(b));

  if(!A.size || !B.size) return 0;

  let common = 0;

  for(const x of A){

    if(B.has(x)) common++;

  }

  const union = new Set([...A,...B]).size;

  return common / union;

}


/* =========================================================
   COINCIDENCIA POR PALABRAS
   ========================================================= */

function wordSimilarity(text,description){

  const A = tokens(text);

  const B = tokens(description);

  if(!A.length || !B.length) return 0;

  let found = 0;

  for(const word of B){

    if(
      A.includes(word) ||
      A.some(x =>
        x === word ||
        x.startsWith(word) ||
        word.startsWith(x)
      )
    ){

      found++;

    }

  }

  return found / B.length;

}


/* =========================================================
   COINCIDENCIA EXACTA
   ========================================================= */

function exactMatch(text){

  const n = norm(text);

  if(EQUIVALENCIAS[n]){

    return EQUIVALENCIAS[n];

  }

  for(const item of LAB_CATALOG){

    if(norm(item.description) === n){

      return {
        description:item.description,
        code:item.code,
        confidence:"EXACTA"
      };

    }

  }

  return null;

}


/* =========================================================
   COINCIDENCIA CONTENIDA
   ========================================================= */

function containedMatch(text){

  const n = norm(text);

  if(n.length < 4) return null;

  let best = null;

  let bestScore = 0;

  for(const item of LAB_CATALOG){

    const d = norm(item.description);

    if(d.length < 4) continue;

    if(
      n.includes(d) ||
      d.includes(n)
    ){

      const score =
        Math.min(n.length,d.length) /
        Math.max(n.length,d.length);

      if(score > bestScore){

        bestScore = score;

        best = item;

      }

    }

  }

  if(best && bestScore >= .55){

    return {
      description:best.description,
      code:best.code,
      confidence:"COINCIDENCIA"
    };

  }

  return null;

}


/* =========================================================
   COINCIDENCIA FUZZY
   ========================================================= */

function fuzzyMatch(text){

  let best = null;

  let bestScore = 0;

  for(const item of LAB_CATALOG){

    const s1 = similarity(text,item.description);

    const s2 = wordSimilarity(text,item.description);

    const score =
      Math.max(s1,s2);

    if(score > bestScore){

      bestScore = score;

      best = item;

    }

  }

  if(
    best &&
    bestScore >= .50
  ){

    return {
      description:best.description,
      code:best.code,
      confidence:"PROBABLE"
    };

  }

  return null;

}


/* =========================================================
   ENCONTRAR PRESTACIÓN
   ========================================================= */

function findPrestacion(text){

  const cleaned = String(text || "")
    .replace(/\s+/g," ")
    .trim();

  if(cleaned.length < 3) return null;

  let result =
    exactMatch(cleaned);

  if(result) return result;

  result =
    containedMatch(cleaned);

  if(result) return result;

  result =
    fuzzyMatch(cleaned);

  if(result) return result;

  return null;

}


/* =========================================================
   EXTRAER TEXTO DEL PDF
   ========================================================= */

async function extraerTextoPDF(pdf){

  const paginas = [];

  for(let pageNumber=1;
      pageNumber<=pdf.numPages;
      pageNumber++){

    const page =
      await pdf.getPage(pageNumber);

    const content =
      await page.getTextContent();

    const items =
      content.items || [];

    const lineas = [];

    for(const item of items){

      if(!item.str) continue;

      const text =
        item.str.trim();

      if(!text) continue;

      const x =
        item.transform ?
        item.transform[4] :
        0;

      const y =
        item.transform ?
        item.transform[5] :
        0;

      let linea =
        lineas.find(
          l => Math.abs(l.y-y) < 4
        );

      if(!linea){

        linea = {
          y:y,
          items:[]
        };

        lineas.push(linea);

      }

      linea.items.push({
        text,
        x,
        y
      });

    }


    lineas.sort(
      (a,b) => b.y-a.y
    );


    const resultado = [];

    for(const linea of lineas){

      linea.items.sort(
        (a,b) => a.x-b.x
      );

      const text =
        linea.items
          .map(x => x.text)
          .join(" ")
          .replace(/\s+/g," ")
          .trim();

      if(!text) continue;

      resultado.push({

        text:text,

        x:linea.items[0].x,

        y:linea.y

      });

    }

    paginas.push(resultado);

  }

  return paginas;

}


/* =========================================================
   ANALIZAR
   ========================================================= */

async function analizar(){

  const input =
    document.getElementById("pdf");

  const status =
    document.getElementById("status");

  const file =
    input.files[0];


  if(!file){

    status.textContent =
      "Seleccioná un PDF.";

    status.className =
      "status warn";

    return;

  }


  if(
    file.type !== "application/pdf" &&
    !file.name.toLowerCase().endsWith(".pdf")
  ){

    status.textContent =
      "El archivo seleccionado no parece ser un PDF.";

    status.className =
      "status err";

    return;

  }


  try{

    status.textContent =
      "Leyendo PDF...";

    status.className =
      "status";


    /*
      HACEMOS UNA COPIA PROPIA DE LOS BYTES.

      Esto evita el problema:
      No PDF header found
    */

    const buffer =
      await file.arrayBuffer();

    sourceBytes =
      new Uint8Array(buffer.slice(0));

    sourceName =
      file.name;


    /*
      PDF.JS recibe otra copia.
    */

    const pdfData =
      new Uint8Array(
        sourceBytes.slice(0)
      );


    const pdf =
      await pdfjsLib
        .getDocument({
          data:pdfData
        })
        .promise;


    pdfPages =
      pdf.numPages;


    status.textContent =
      "Analizando todas las páginas...";


    const paginas =
      await extraerTextoPDF(pdf);


    detections = [];


    /*
      ANALIZAMOS CADA LÍNEA.
      YA NO SE EXIGE:
      - MAYÚSCULA
      - NEGRITA
    */

    for(
      let p=0;
      p<paginas.length;
      p++
    ){

      const lineas =
        paginas[p];


      for(
        let i=0;
        i<lineas.length;
        i++
      ){

        const linea =
          lineas[i];

        let result =
          findPrestacion(linea.text);


        /*
          También intentamos unir
          dos líneas consecutivas.
        */

        if(!result && i < lineas.length-1){

          const dosLineas =
            linea.text +
            " " +
            lineas[i+1].text;

          result =
            findPrestacion(dosLineas);

        }


        if(result){

          detections.push({

            page:p+1,

            source:linea.text,

            description:
              result.description,

            code:
              result.code,

            confidence:
              result.confidence,

            x:
              linea.x,

            y:
              linea.y

          });

        }

      }

    }


    /*
      ELIMINAR DUPLICADOS
    */

    const seen =
      new Set();

    detections =
      detections.filter(item => {

        const key =
          item.page +
          "|" +
          norm(item.source) +
          "|" +
          item.code;

        if(seen.has(key)){

          return false;

        }

        seen.add(key);

        return true;

      });


    /*
      SI ENCONTRÓ AL MENOS UNA
      PRESTACIÓN DE LABORATORIO,
      AGREGAMOS ACTO BIOQUÍMICO.
    */

    const tieneLaboratorio =
      detections.some(
        x => x.code.startsWith("LAB.")
      );


    if(
      tieneLaboratorio &&
      !detections.some(
        x => x.code === "LAB.00.001"
      )
    ){

      detections.unshift({

        page:1,

        source:"ACTO BIOQUÍMICO",

        description:
          ACTO_BIOQUIMICO.description,

        code:
          ACTO_BIOQUIMICO.code,

        confidence:
          ACTO_BIOQUIMICO.confidence,

        x:40,

        y:40,

        acto:true

      });

    }


    if(detections.length){

      status.textContent =
        "Análisis terminado. " +
        detections.length +
        " prestación(es) encontrada(s).";

      status.className =
        "status ok";

    }else{

      status.textContent =
        "Análisis terminado. No se encontraron coincidencias en el catálogo actual.";

      status.className =
        "status warn";

    }


    document.getElementById(
      "resultado"
    ).style.display =
      "block";


    render();

  }
  catch(error){

    console.error(error);

    status.textContent =
      "No se pudo analizar el PDF.\n\n" +
      error.message;

    status.className =
      "status err";

  }

}


/* =========================================================
   MOSTRAR RESULTADOS
   ========================================================= */

function render(){

  const aviso =
    document.getElementById("aviso");

  const lista =
    document.getElementById("lista");

  const contador =
    document.getElementById("contador");

  const generar =
    document.getElementById("generar");


  contador.innerHTML =
    '<div class="counter">' +
    'Prestaciones encontradas: ' +
    detections.length +
    '</div>';


  if(
    detections.some(
      x => x.code === "LAB.00.001"
    )
  ){

    aviso.innerHTML =
      '<div class="success-box">' +
      '<b>ACTO BIOQUÍMICO agregado automáticamente.</b>' +
      '<br>Código: LAB.00.001' +
      '</div>';

  }else{

    aviso.innerHTML = "";

  }


  if(!detections.length){

    lista.innerHTML =
      '<div class="status warn">' +
      'No se encontraron prestaciones codificables con el catálogo cargado.' +
      '</div>';

    generar.disabled =
      true;

    return;

  }


  lista.innerHTML =
    detections
      .map((x,index) => {

        return `

        <div class="item">

          <b>
            ${esc(x.source)}
          </b>

          <br>

          → ${esc(x.description)}

          <br>

          <span class="code">
            ${esc(x.code)}
          </span>

          <br>

          <span class="small">

            Página ${x.page}

            ·

            <span class="badge">
              ${esc(x.confidence)}
            </span>

          </span>

        </div>

        `;

      })
      .join("");


  generar.disabled =
    false;

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function esc(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      function(match){

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        }[match];

      }
    );

}


/* =========================================================
   GENERAR PDF
   ========================================================= */

async function generarPDF(){

  const status =
    document.getElementById("status");


  if(!sourceBytes){

    status.textContent =
      "No hay un PDF cargado.";

    status.className =
      "status err";

    return;

  }


  if(!detections.length){

    status.textContent =
      "No hay prestaciones para codificar.";

    status.className =
      "status warn";

    return;

  }


  try{

    status.textContent =
      "Generando PDF codificado...";

    status.className =
      "status";


    /*
      MUY IMPORTANTE:

      PDF-LIB recibe una copia nueva
      de los bytes originales.
    */

    const original =
      new Uint8Array(
        sourceBytes.slice(0)
      );


    const doc =
      await PDFLib.PDFDocument.load(
        original
      );


    const font =
      await doc.embedFont(
        PDFLib.StandardFonts.HelveticaBold
      );


    for(
      const item of detections
    ){

      if(item.page < 1) continue;

      if(item.page > doc.getPageCount())
        continue;


      const page =
        doc.getPage(item.page-1);


      const width =
        page.getWidth();

      const height =
        page.getHeight();


      /*
        PDF.js y PDF-LIB utilizan
        coordenadas diferentes.
      */

      let x =
        Number(item.x) + 170;


      let y =
        height -
        Number(item.y) -
        5;


      if(item.acto){

        x = 40;

        y = height - 40;

      }


      /*
        Evitar que el código
        quede fuera de la página.
      */

      if(x > width-140){

        x =
          Math.max(
            20,
            width-140
          );

      }


      if(y < 15){

        y = 15;

      }


      /*
        Código visible.
      */

      page.drawText(
        "[" + item.code + "]",
        {

          x:x,

          y:y,

          size:9,

          font:font

        }
      );

    }


    const output =
      await doc.save();


    /*
      Creamos un Blob nuevo.
    */

    const blob =
      new Blob(
        [output],
        {
          type:"application/pdf"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const a =
      document.createElement("a");


    a.href =
      url;


    a.download =
      sourceName
        .replace(/\.pdf$/i,"") +
        "_CODIFICADO.pdf";


    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);


    setTimeout(
      () => URL.revokeObjectURL(url),
      10000
    );


    status.textContent =
      "PDF codificado generado correctamente.";

    status.className =
      "status ok";


  }
  catch(error){

    console.error(error);

    status.textContent =
      "Error al generar PDF:\n\n" +
      error.message;

    status.className =
      "status err";

  }

}


/* =========================================================
   LIMPIAR
   ========================================================= */

function limpiar(){

  document.getElementById("pdf").value = "";

  document.getElementById("resultado").style.display =
    "none";

  document.getElementById("status").textContent =
    "Esperando PDF…";

  document.getElementById("status").className =
    "status";

  detections = [];

  sourceBytes = null;

  sourceName = "ESTUDIO.pdf";

}

   FIN

</script>
