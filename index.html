<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#111827">

<title>Codificador de Prestaciones Mendoza</title>

<style>

*{
    box-sizing:border-box
}

body{
    margin:0;
    background:#f3f4f6;
    color:#111827;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

main{
    max-width:820px;
    margin:auto;
    padding:16px;
}

.card{
    background:#fff;
    border-radius:18px;
    padding:18px;
    margin:12px 0;
    box-shadow:0 3px 15px #0001;
}

h1{
    font-size:24px;
    margin:0;
}

h2{
    font-size:20px;
}

.muted{
    color:#6b7280;
}

.small{
    color:#6b7280;
    font-size:13px;
}

input[type=file]{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:12px;
    background:#fff;
    margin-top:10px;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 16px;
    background:#111827;
    color:white;
    font-weight:750;
    font-size:15px;
    margin-top:10px;
    width:100%;
    cursor:pointer;
}

button:hover{
    opacity:.92;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

button.secondary{
    background:#e5e7eb;
    color:#111827;
}

.status{
    padding:12px;
    border-radius:12px;
    background:#f9fafb;
    margin-top:12px;
    white-space:pre-wrap;
}

.ok{
    background:#ecfdf5;
    color:#065f46;
}

.warn{
    background:#fffbeb;
    color:#92400e;
}

.err{
    background:#fef2f2;
    color:#991b1b;
}

.item{
    padding:13px 0;
    border-bottom:1px solid #e5e7eb;
}

.item:last-child{
    border-bottom:0;
}

.code{
    font-weight:900;
}

.badge{
    display:inline-block;
    padding:3px 8px;
    border-radius:999px;
    background:#eef2ff;
    font-size:12px;
    font-weight:800;
}

.info{
    padding:12px;
    background:#f3f4f6;
    border-radius:12px;
    margin-top:12px;
    font-size:14px;
    line-height:1.5;
}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

</head>

<body>

<main>

<section class="card">

<h1>Codificador de Prestaciones</h1>

<div class="muted">
Nomenclador Mendoza · Marzo 2026
</div>

</section>


<section class="card">

<b>Seleccioná el estudio médico en PDF</b>

<input
    id="pdf"
    type="file"
    accept="application/pdf"
>

<button onclick="analizar()">
    ANALIZAR ESTUDIO
</button>

<button
    class="secondary"
    onclick="location.reload()"
>
    LIMPIAR
</button>

<div
    id="status"
    class="status"
>
    Esperando PDF…
</div>

</section>


<section
    id="resultado"
    class="card"
    style="display:none"
>

<h2 style="margin-top:0">
    Resultado
</h2>

<div id="aviso"></div>

<div id="lista"></div>

<button
    id="generar"
    onclick="generarPDF()"
    disabled
>
    GENERAR PDF CODIFICADO
</button>

</section>

</main>
