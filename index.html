<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codificador de Prestaciones - Mendoza Marzo 2026</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.container{
    max-width:1100px;
    margin:30px auto;
    padding:25px;
}

.card{
    background:white;
    border-radius:14px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1{
    margin:0 0 5px;
    font-size:28px;
}

.subtitle{
    color:#6b7280;
    margin-bottom:25px;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin:20px 0;
}

button{
    border:0;
    border-radius:8px;
    padding:12px 18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

#analyzeBtn{
    background:#111827;
    color:white;
}

#clearBtn{
    background:#e5e7eb;
    color:#111827;
}

#generateBtn{
    background:#2563eb;
    color:white;
    display:none;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

input[type=file]{
    width:100%;
    padding:14px;
    border:2px dashed #d1d5db;
    border-radius:10px;
    background:#fafafa;
}

.status{
    margin-top:15px;
    padding:14px;
    border-radius:8px;
    background:#f3f4f6;
    display:none;
}

.status.ok{
    display:block;
    background:#ecfdf5;
    color:#065f46;
}

.status.error{
    display:block;
    background:#fef2f2;
    color:#991b1b;
}

.status.info{
    display:block;
    background:#eff6ff;
    color:#1e40af;
}

.result{
    margin-top:25px;
}

.result h2{
    margin-bottom:15px;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
}

th,td{
    padding:11px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
}

th{
    background:#f9fafb;
}

.code{
    font-weight:bold;
    white-space:nowrap;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:5px;
    background:#dcfce7;
    color:#166534;
    font-weight:bold;
}

.empty{
    padding:20px;
    background:#fff7ed;
    color:#9a3412;
    border-radius:8px;
}

.loading{
    display:none;
    margin-top:15px;
}

.spinner{
    display:inline-block;
    width:18px;
    height:18px;
    border:3px solid #ddd;
    border-top-color:#111827;
    border-radius:50%;
    animation:spin .8s linear infinite;
    vertical-align:middle;
    margin-right:8px;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Codificador de Prestaciones</h1>
<div class="subtitle">Nomenclador Mendoza · Marzo 2026</div>

<input id="pdfInput" type="file" accept="application/pdf">

<div class="buttons">
<button id="analyzeBtn">ANALIZAR ESTUDIO</button>
<button id="clearBtn">LIMPIAR</button>
<button id="generateBtn">GENERAR PDF CODIFICADO</button>
</div>

<div id="loading" class="loading">
<span class="spinner"></span>
Analizando estudio...
</div>

<div id="status" class="status"></div>

<div id="result" class="result"></div>

</div>
</div>

/* =========================================================
   NORMALIZACIÓN
========================================================= */

function normalizeText(text){

    return String(text || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/[º°]/g,"")
        .replace(/[^\p{L}\p{N}%/+().,-]+/gu," ")
        .replace(/\s+/g," ")
        .trim()
        .toUpperCase();

}


/* =========================================================
   DETERMINAR MAYÚSCULAS
========================================================= */

function isUpper(text){

    if(!text) return false;

    const letters = String(text).match(/\p{L}/gu);

    if(!letters || letters.length === 0){
        return false;
    }

    const upper = String(text)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/g,"");

    const lower = upper.toLowerCase();

    return upper === upper.toUpperCase() &&
           upper !== lower;
}


/* =========================================================
   DETERMINAR NEGRITA
========================================================= */

function isBold(item, styles){

    if(!item) return false;

    const fontName = String(item.fontName || "");

    let fontFamily = "";

    if(styles && styles[item.fontName]){
        fontFamily = String(styles[item.fontName].fontFamily || "");
    }

    const combined =
        (fontName + " " + fontFamily).toLowerCase();

    return (
        /bold/.test(combined) ||
        /black/.test(combined) ||
        /heavy/.test(combined) ||
        /semibold/.test(combined) ||
        /demi/.test(combined) ||
        /negrita/.test(combined)
    );
}


/* =========================================================
   CATÁLOGO NORMALIZADO
========================================================= */

const NORMALIZED_CATALOG = LAB_CATALOG.map((item,index)=>({

    ...item,

    index,

    normalized:
        normalizeText(item.description)

}));


/* =========================================================
   BUSCAR PRESTACIÓN
========================================================= */

function findPrestacion(text){

    const normalized = normalizeText(text);

    if(!normalized){
        return null;
    }

    /* Primero alias exacto */
    if(ALIASES[normalized]){

        const code = ALIASES[normalized];

        return LAB_CATALOG.find(x => x.code === code) || {
            code,
            description:text
        };

    }

    /* Coincidencia exacta */
    let exact = NORMALIZED_CATALOG.find(
        item => item.normalized === normalized
    );

    if(exact){
        return exact;
    }

    /* Coincidencia del texto completo */
    const candidates = NORMALIZED_CATALOG
        .filter(item =>
            normalized.includes(item.normalized) ||
            item.normalized.includes(normalized)
        )
        .sort((a,b) =>
            b.normalized.length - a.normalized.length
        );

    return candidates[0] || null;
}


/* =========================================================
   AGRUPAR TEXTO
========================================================= */

function buildTextGroups(items){

    const groups = [];

    let current = null;

    for(const item of items){

        const text = String(item.str || "").trim();

        if(!text){
            continue;
        }

        const transform = item.transform || [1,0,0,1,0,0];

        const x = transform[4];
        const y = transform[5];

        const lineTolerance = 4;

        if(
            current &&
            Math.abs(current.y - y) <= lineTolerance
        ){

            current.items.push(item);
            current.text += " " + text;

        }else{

            current = {
                items:[item],
                text,
                x,
                y,
                bold:isBold(item,null)
            };

            groups.push(current);

        }

    }

    return groups;
}


/* =========================================================
   ANALIZAR PDF
========================================================= */

let sourceBytes = null;
let sourcePdf = null;
let detectedPrestations = [];
let detectedItems = [];


async function analyzePDF(){

    const input = document.getElementById("pdfInput");

    if(!input.files || input.files.length === 0){

        showStatus(
            "Seleccioná un archivo PDF.",
            "error"
        );

        return;
    }

    const file = input.files[0];

    if(file.type !== "application/pdf"){

        showStatus(
            "El archivo seleccionado no es un PDF.",
            "error"
        );

        return;
    }

    showLoading(true);

    try{

        /*
         IMPORTANTE:
         sourceBytes se inicializa ANTES de usarlo.
        */

        sourceBytes =
            new Uint8Array(
                await file.arrayBuffer()
            );

        if(
            !sourceBytes ||
            sourceBytes.length < 5
        ){

            throw new Error(
                "El archivo PDF está vacío o es inválido."
            );

        }

        const header =
            new TextDecoder()
                .decode(sourceBytes.slice(0,5));

        if(header !== "%PDF-"){

            throw new Error(
                "El archivo seleccionado no contiene un encabezado PDF válido."
            );

        }

        sourcePdf =
            await pdfjsLib.getDocument({
                data:sourceBytes
            }).promise;

        detectedPrestations = [];
        detectedItems = [];

        for(
            let pageNumber = 1;
            pageNumber <= sourcePdf.numPages;
            pageNumber++
        ){

            const page =
                await sourcePdf.getPage(pageNumber);

            const textContent =
                await page.getTextContent({
                    normalizeWhitespace:false
                });

            const styles =
                textContent.styles || {};

            /*
             NO se analiza todo el informe como una prestación.
             Solamente se consideran elementos que tengan:
             1. letras
             2. MAYÚSCULAS
             3. NEGRITA
            */

            for(const item of textContent.items){

                const raw =
                    String(item.str || "").trim();

                if(!raw){
                    continue;
                }

                if(!isUpper(raw)){
                    continue;
                }

                if(!isBold(item,styles)){
                    continue;
                }

                const prestation =
                    findPrestacion(raw);

                if(!prestation){
                    continue;
                }

                const transform =
                    item.transform || [1,0,0,1,0,0];

                detectedPrestations.push({

                    page:pageNumber,

                    text:raw,

                    code:prestation.code,

                    description:prestation.description,

                    x:transform[4],

                    y:transform[5],

                    width:item.width || 0,

                    height:item.height || 10,

                    transform

                });

            }

        }

        /*
         Eliminar duplicados.
        */

        const unique = new Map();

        for(const item of detectedPrestations){

            const key =
                [
                    item.page,
                    item.code,
                    normalizeText(item.text),
                    Math.round(item.x),
                    Math.round(item.y)
                ].join("|");

            if(!unique.has(key)){
                unique.set(key,item);
            }

        }

        detectedPrestations =
            Array.from(unique.values());


        /*
         Ordenar por página y posición.
        */

        detectedPrestations.sort((a,b)=>{

            if(a.page !== b.page){
                return a.page - b.page;
            }

            return b.y - a.y;

        });


        /*
         El Acto Bioquímico se agrega una sola vez
         si existen prestaciones de laboratorio.
        */

        if(detectedPrestations.length > 0){

            detectedPrestations.unshift({

                page:0,

                text:"ACTO BIOQUÍMICO",

                code:ACTO_BIOQUIMICO.code,

                description:ACTO_BIOQUIMICO.description,

                x:0,

                y:0,

                width:0,

                height:0,

                synthetic:true

            });

        }


        renderResults();

        if(detectedPrestations.length > 0){

            showStatus(
                "Análisis terminado. Se encontraron " +
                (detectedPrestations.length - 1) +
                " prestaciones codificables.",
                "ok"
            );

            document.getElementById(
                "generateBtn"
            ).style.display = "inline-block";

        }else{

            showStatus(
                "No se encontró una prestación codificable con las reglas actuales.",
                "info"
            );

            document.getElementById(
                "generateBtn"
            ).style.display = "none";

        }

    }catch(error){

        console.error(error);

        showStatus(
            "Error al analizar PDF: " +
            (error.message || error),
            "error"
        );

    }finally{

        showLoading(false);

    }

}


/* =========================================================
   MOSTRAR RESULTADOS
========================================================= */

function renderResults(){

    const result =
        document.getElementById("result");

    const realItems =
        detectedPrestations.filter(
            x => !x.synthetic
        );

    if(realItems.length === 0){

        result.innerHTML = `
            <h2>Resultado</h2>
            <div class="empty">
                No se encontró una prestación codificable con las reglas actuales.
            </div>
        `;

        return;
    }

    let html = `
        <h2>Resultado</h2>

        <table>

        <thead>
            <tr>
                <th>Página</th>
                <th>Prestación detectada</th>
                <th>Código</th>
            </tr>
        </thead>

        <tbody>
    `;

    for(const item of realItems){

        html += `
            <tr>
                <td>${item.page}</td>

                <td>
                    <strong>${escapeHtml(item.text)}</strong>
                </td>

                <td class="code">
                    <span class="badge">
                        ${escapeHtml(item.code)}
                    </span>
                </td>
            </tr>
        `;

    }

    html += `
        </tbody>
        </table>

        <br>

        <strong>
            Acto Bioquímico:
        </strong>

        <span class="badge">
            ${ACTO_BIOQUIMICO.code}
        </span>
    `;

    result.innerHTML = html;
}


/* =========================================================
   GENERAR PDF
========================================================= */

async function generatePDF(){

    if(!sourceBytes || sourceBytes.length === 0){

        showStatus(
            "No hay un PDF cargado.",
            "error"
        );

        return;

    }

    if(
        typeof PDFLib === "undefined" ||
        !PDFLib.PDFDocument
    ){

        showStatus(
            "No se pudo cargar el motor de generación PDF.",
            "error"
        );

        return;

    }

    showLoading(true);

    try{

        /*
         Se usa una COPIA independiente.
         No se modifica sourceBytes.
        */

        const pdfBytes =
            new Uint8Array(sourceBytes);

        const pdfDoc =
            await PDFLib.PDFDocument.load(
                pdfBytes
            );

        const pages =
            pdfDoc.getPages();

        /*
         Acto Bioquímico:
         se coloca solamente si hay prestaciones.
         Se agrega en la primera página.
        */

        const realItems =
            detectedPrestations.filter(
                x => !x.synthetic
            );

        /*
         ====================================================
         DIBUJAR CÓDIGOS
         ====================================================
        */

        for(const item of realItems){

            const page =
                pages[item.page - 1];

            if(!page){
                continue;
            }

            const pageWidth =
                page.getWidth();

            const pageHeight =
                page.getHeight();

            /*
             PDF.js y PDF-lib pueden trabajar
             con sistemas de coordenadas diferentes.
            */

            let x = Number(item.x) || 0;

            let y = Number(item.y) || 0;

            let width =
                Number(item.width) || 50;

            let height =
                Number(item.height) || 10;


            /*
             Escala aproximada entre PDF.js
             y PDF-lib.
            */

            const viewport =
                await sourcePdf
                    .getPage(item.page)
                    .then(p =>
                        p.getViewport({
                            scale:1
                        })
                    );

            const scaleX =
                pageWidth / viewport.width;

            const scaleY =
                pageHeight / viewport.height;

            x *= scaleX;

            y *= scaleY;

            width *= scaleX;

            height *= scaleY;


            /*
             Convertir coordenada vertical.
            */

            y =
                pageHeight -
                y;


            /*
             Colocar el código inmediatamente
             después del nombre detectado.
            */

            let codeX =
                x + width + 8;

            /*
             Evitar que el código salga
             del margen derecho.
            */

            if(codeX > pageWidth - 90){

                codeX =
                    Math.max(
                        5,
                        x
                    );

                y -=
                    height + 3;

            }


            /*
             Evitar coordenadas inválidas.
            */

            if(!Number.isFinite(codeX)){
                codeX = 10;
            }

            if(!Number.isFinite(y)){
                y = 20;
            }

            if(y < 5){
                y = 5;
            }

            if(y > pageHeight - 5){
                y = pageHeight - 15;
            }


            page.drawText(
                item.code,
                {
                    x:codeX,

                    y:y - 4,

                    size:8,

                    font:
                        await pdfDoc.embedFont(
                            PDFLib.StandardFonts.HelveticaBold
                        ),

                    color:
                        PDFLib.rgb(
                            0,
                            0.35,
                            0.85
                        )
                }
            );

        }


        /*
         ====================================================
         GUARDAR
         ====================================================
        */

        const outputBytes =
            await pdfDoc.save({
                useObjectStreams:false
            });

        const blob =
            new Blob(
                [outputBytes],
                {
                    type:"application/pdf"
                }
            );

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            "estudio_codificado.pdf";

        document.body.appendChild(a);

        a.click();

        a.remove();

        setTimeout(
            () => URL.revokeObjectURL(url),
            3000
        );


        showStatus(
            "PDF codificado generado correctamente.",
            "ok"
        );

    }catch(error){

        console.error(error);

        showStatus(
            "Error al generar PDF: " +
            (error.message || error),
            "error"
        );

    }finally{

        showLoading(false);

    }

}


/* =========================================================
   LIMPIAR
========================================================= */

function clearAll(){

    document.getElementById(
        "pdfInput"
    ).value = "";

    document.getElementById(
        "result"
    ).innerHTML = "";

    document.getElementById(
        "status"
    ).style.display = "none";

    document.getElementById(
        "generateBtn"
    ).style.display = "none";

    sourceBytes = null;
    sourcePdf = null;
    detectedPrestations = [];
    detectedItems = [];

}


/* =========================================================
   UTILIDADES
========================================================= */

function showStatus(message,type){

    const status =
        document.getElementById("status");

    status.textContent = message;

    status.className =
        "status " + type;

    status.style.display =
        "block";
}


function showLoading(show){

    document.getElementById(
        "loading"
    ).style.display =
        show ? "block" : "none";

    document.getElementById(
        "analyzeBtn"
    ).disabled = show;

    document.getElementById(
        "generateBtn"
    ).disabled = show;

}


function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   EVENTOS
========================================================= */

document.getElementById(
    "analyzeBtn"
).addEventListener(
    "click",
    analyzePDF
);


document.getElementById(
    "generateBtn"
).addEventListener(
    "click",
    generatePDF
);


document.getElementById(
    "clearBtn"
).addEventListener(
    "click",
    clearAll
);


/* =========================================================
   INICIO
========================================================= */

showStatus(
    "Seleccioná el estudio médico en PDF.",
    "info"
);

</script>
