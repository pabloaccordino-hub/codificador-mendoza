<script type="module">

/* =========================================================
   1. INICIALIZACIÓN DE PDF.JS Y VARIABLES GLOBALES
========================================================= */
const pdfjsLib = await import(
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
);

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

let NOMENCLADOR = [];
let EQUIVALENCIAS = {};

// Elementos de la interfaz (DOM)
const pdfInput = document.getElementById('pdfInput');
const analyzeBtn = document.getElementById('analyzeBtn');
const clearBtn = document.getElementById('clearBtn');
const generateBtn = document.getElementById('generateBtn');
const loadingDiv = document.getElementById('loading');
const statusDiv = document.getElementById('status');
const resultDiv = document.getElementById('result');


/* =========================================================
   2. CARGA ASÍNCRONA DE NOMENCLADOR Y EQUIVALENCIAS
========================================================= */
async function cargarCatalogos() {
    try {
        mostrarEstado("Cargando catálogo y equivalencias...", "info");
        
        // Fetch paralelo para obtener ambos JSON
        const [resNomenclador, resEquivalencias] = await Promise.all([
            fetch('./nomenclador.json'),
            fetch('./equivalencias.json')
        ]);

        if (!resNomenclador.ok || !resEquivalencias.ok) {
            throw new Error("No se pudieron cargar los archivos JSON.");
        }

        NOMENCLADOR = await resNomenclador.json();
        EQUIVALENCIAS = await resEquivalencias.json();

        mostrarEstado("Catálogos cargados correctamente.", "ok");
    } catch (error) {
        console.error("Error al cargar los JSON:", error);
        mostrarEstado("Error al cargar nomenclador.json o equivalencias.json. Verifica las rutas del proyecto.", "error");
    }
}

// Iniciar la carga al abrir la página
cargarCatalogos();


/* =========================================================
   3. EXTRACCIÓN SEGURO DE TEXTO DESDE PDF
========================================================= */
async function extraerTextoPDF(file) {
    const arrayBuffer = await file.arrayBuffer();
    
    // NOTA: Se utiliza .slice(0) para prevenir el error "detached ArrayBuffer"
    const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer.slice(0)) });
    const pdf = await loadingTask.promise;
    
    let textoCompleto = "";

    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const textContent = await page.getTextContent();
        const pageText = textContent.items.map(item => item.str).join(" ");
        textoCompleto += pageText + "\n";
    }

    return textoCompleto;
}


/* =========================================================
   4. LÓGICA DE BÚSQUEDA Y MAPEO DE CÓDIGOS
========================================================= */
function procesarEstudio(textoExtraido) {
    const textoNormalizado = textoExtraido.toLowerCase();
    const resultados = [];

    // Recorrer las entradas del Nomenclador
    NOMENCLADOR.forEach(item => {
        const descripcionBuscada = item.description ? item.description.toLowerCase() : "";
        
        // Comprobar si la descripción existe en el texto extraído
        if (descripcionBuscada && textoNormalizado.includes(descripcionBuscada)) {
            
            // 1. Obtener equivalencia si existiera asignada
            const codigoEquivalente = EQUIVALENCIAS[item.code] || item.code;

            resultados.push({
                codigoOficial: item.code,
                codigoMapeado: codigoEquivalente,
                descripcion: item.description
            });
        }
    });

    return resultados;
}


/* =========================================================
   5. INTERFAZ Y EVENTOS
========================================================= */
analyzeBtn.addEventListener('click', async () => {
    const file = pdfInput.files[0];
    if (!file) {
        mostrarEstado("Por favor, selecciona un archivo PDF primero.", "error");
        return;
    }

    mostrarCargando(true);
    limpiarResultados();

    try {
        const texto = await extraerTextoPDF(file);
        const hallazgos = procesarEstudio(texto);

        mostrarCargando(false);
        renderizarTabla(hallazgos);
    } catch (err) {
        console.error(err);
        mostrarCargando(false);
        mostrarEstado("Error procesando el documento PDF: " + err.message, "error");
    }
});

clearBtn.addEventListener('click', () => {
    pdfInput.value = "";
    limpiarResultados();
    mostrarEstado("", "");
    statusDiv.style.display = "none";
});

function renderizarTabla(lista) {
    if (lista.length === 0) {
        resultDiv.innerHTML = `<div class="empty">No se encontraron prestaciones del catálogo en el documento.</div>`;
        return;
    }

    let html = `
        <h2>Prestaciones Detectadas (${lista.length})</h2>
        <table>
            <thead>
                <tr>
                    <th>Código Nomenclador</th>
                    <th>Código Equivalente</th>
                    <th>Descripción</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
    `;

    lista.forEach(row => {
        html += `
            <tr>
                <td class="code">${row.codigoOficial}</td>
                <td class="code">${row.codigoMapeado}</td>
                <td>${row.descripcion}</td>
                <td><span class="badge">Codificado</span></td>
            </tr>
        `;
    });

    html += `</tbody></table>`;
    resultDiv.innerHTML = html;
    generateBtn.style.display = "inline-block";
}

function mostrarEstado(mensaje, tipo) {
    statusDiv.className = `status ${tipo}`;
    statusDiv.textContent = mensaje;
}

function mostrarCargando(visible) {
    loadingDiv.style.display = visible ? "block" : "none";
    analyzeBtn.disabled = visible;
}

function limpiarResultados() {
    resultDiv.innerHTML = "";
    generateBtn.style.display = "none";
}

</script>
