<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:30px;

    font-family:Arial,Helvetica,sans-serif;
    color:#111827;
}

.container{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:14px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

h1{
    margin-top:0;
    font-size:28px;
}

.subtitle{
    color:#6b7280;
    margin-bottom:25px;
}

.controls{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

button,
.file-label{
    border:0;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

.file-label{
    background:#111827;
    color:white;
    display:inline-block;
}

button{
    background:#2563eb;
    color:white;
}

button.secondary{
    background:#6b7280;
}

button.success{
    background:#059669;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

input[type=file]{
    display:none;
}

.status{
    padding:15px;
    border-radius:8px;
    background:#f3f4f6;
    margin:15px 0;
    white-space:pre-line;
}

.status.ok{
    background:#ecfdf5;
    color:#065f46;
}

.status.error{
    background:#fef2f2;
    color:#991b1b;
}

.status.warning{
    background:#fffbeb;
    color:#92400e;
}

.results{
    margin-top:25px;
}

.result{
    border:1px solid #e5e7eb;
    padding:14px;
    margin-bottom:10px;
    border-radius:8px;
    background:#fafafa;
}

.result .name{
    font-weight:bold;
}

.result .code{
    color:#2563eb;
    font-weight:bold;
}

.result .page{
    color:#6b7280;
    font-size:13px;
}

.small{
    font-size:13px;
    color:#6b7280;
}

#loading{
    display:none;
    padding:15px;
    background:#eff6ff;
    color:#1e40af;
    border-radius:8px;
    margin-top:15px;
}
</style>
</head>

<div class="container">

<h1>Codificador de Prestaciones</h1>

</button>

<button id="clearBtn" class="secondary">
LIMPIAR
</button>

<button id="generateBtn" class="success" disabled>

</div>

<div id="results" class="results"></div>

let analyzedPdf = null;

let detectedPrestations = [];

let selectedFileName = "";

const pdfFile =
    document.getElementById("pdfFile");

const analyzeBtn =
    document.getElementById("analyzeBtn");

const clearBtn =
    document.getElementById("clearBtn");

const generateBtn =
    document.getElementById("generateBtn");

const statusBox =
    document.getElementById("status");

const resultsBox =
    document.getElementById("results");

const loadingBox =
    document.getElementById("loading");


/* ============================================================
   NORMALIZACIÓN
   ============================================================ */

function normalizeText(text){

    if(!text){
        return "";
    }

    return text
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/[‐-‒–—−]/g,"-")
        .replace(/[“”„"]/g,'"')
        .replace(/[‘’]/g,"'")
        .replace(/\s+/g," ")
        .trim()
        .toUpperCase();
}


/* ============================================================
   DETERMINAR SI ES MAYÚSCULA
   ============================================================ */

function isUpper(text){

    if(!text){
        return false;
    }

    const letters = text.match(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/g);

    if(!letters || letters.length === 0){
        return false;
    }

    const upper = text.toLocaleUpperCase("es-AR");

    const lower = text.toLocaleLowerCase("es-AR");

    return upper !== lower &&
           text === upper;
}


/* ============================================================
   DETECTAR NEGRITA
   ============================================================ */

function isBoldFont(fontName, style){

    const value = (
        String(fontName || "") +
        " " +
        String(style || "")
    ).toLowerCase();

    return (
        value.includes("bold") ||
        value.includes("black") ||
        value.includes("heavy") ||
        value.includes("semibold") ||
        value.includes("demi")
    );
}


/* ============================================================
   NORMALIZAR CATÁLOGO
   ============================================================ */

function prepareCatalog(){

    const map = new Map();

    for(const item of LAB_CATALOG){

        if(!item){
            continue;
        }

        if(!item.code || !item.description){
            continue;
        }

        const code =
            String(item.code)
            .trim()
            .toUpperCase();

        const description =
            String(item.description)
            .trim();

        const normalized =
            normalizeText(description);

        if(!normalized){
            continue;
        }

        /*
           Si el mismo código aparece varias veces,
           nos quedamos con una sola entrada.
        */

        if(!map.has(code)){

            map.set(code,{
                code:code,
                description:description,
                normalized:normalized
            });

        }
    }

    return Array.from(map.values());
}


/* ============================================================
   COMPARACIÓN EXACTA
   ============================================================ */

function exactCatalogMatch(text){

    const normalized =
        normalizeText(text);

    if(!normalized){
        return null;
    }

    const catalog =
        prepareCatalog();

    /*
       PRIMERA REGLA:
       coincidencia exacta.
    */

    for(const item of catalog){

        if(normalized === item.normalized){

            return item;

        }
    }

    return null;
}


/* ============================================================
   COMPARACIÓN SEGURA DE VARIAS PALABRAS
   ============================================================ */

function cleanForComparison(text){

    return normalizeText(text)
        .replace(/[():;,./\\|]+/g," ")
        .replace(/\s+/g," ")
        .trim();
}


/* ============================================================
   BÚSQUEDA EN BLOQUES
   ============================================================ */

function findPrestationsInLine(items){

    const found = [];

    if(!items || !items.length){
        return found;
    }

    /*
       Primero intentamos cada elemento individual.
    */

    for(let i=0;i<items.length;i++){

        const item = items[i];

        const text =
            String(item.str || "").trim();

        if(!text){
            continue;
        }

        /*
           SOLO MAYÚSCULA
        */

        if(!isUpper(text)){
            continue;
        }

        /*
           SOLO NEGRITA
        */

        if(!item.isBold){
            continue;
        }

        const match =
            exactCatalogMatch(text);

        if(match){

            found.push({
                ...match,
                originalText:text,
                item:item
            });

        }
    }


    /*
       Ahora intentamos reconstruir prestaciones que PDF.js
       haya separado en varios fragmentos.

       Ejemplo:

       HEMOGLOBINA
       GLICOSILADA
       (HB A1C)

       puede venir como tres elementos distintos.
    */

    for(let start=0; start<items.length; start++){

        let combined = "";

        let validBoldUpper = true;

        for(
            let end=start;
            end<items.length && end<start+12;
            end++
        ){

            const item = items[end];

            const text =
                String(item.str || "").trim();

            if(!text){
                continue;
            }

            if(!isUpper(text)){
                validBoldUpper = false;
                break;
            }

            if(!item.isBold){
                validBoldUpper = false;
                break;
            }

            combined +=
                (combined ? " " : "") +
                text;

            const match =
                exactCatalogMatch(combined);

            if(match){

                found.push({
                    ...match,
                    originalText:combined,
                    item:item
                });

            }
        }
    }

    return found;
}


/* ============================================================
   OBTENER INFORMACIÓN DE PÁGINA
   ============================================================ */

async function extractPdfData(bytes){

    const loadingTask =
        pdfjsLib.getDocument({
            data:bytes
        });

    const pdf =
        await loadingTask.promise;

    const pages = [];

    for(
        let pageNumber=1;
        pageNumber<=pdf.numPages;
        pageNumber++
    ){

        const page =
            await pdf.getPage(pageNumber);

        const textContent =
            await page.getTextContent({
                includeMarkedContent:true
            });

        const styles =
            textContent.styles || {};

        const items = [];

        for(const rawItem of textContent.items){

            if(!rawItem.str){
                continue;
            }

            const style =
                styles[rawItem.fontName] || {};

            const bold =
                isBoldFont(
                    rawItem.fontName,
                    style.fontFamily
                );

            items.push({

                str:rawItem.str,

                fontName:
                    rawItem.fontName,

                style:
                    style.fontFamily || "",

                isBold:bold,

                transform:
                    rawItem.transform,

                width:
                    rawItem.width,

                height:
                    rawItem.height,

                dir:
                    rawItem.dir

            });
        }

        pages.push({
            pageNumber,
            items
        });
    }

    return {
        pdf,
        pages
    };
}


/* ============================================================
   ANALIZAR PDF
   ============================================================ */

async function analyzePDF(){

    if(!originalPdfBytes){
        return;
    }

    try{

        loadingBox.style.display = "block";

        statusBox.className = "status";

        statusBox.textContent =
            "Analizando únicamente prestaciones en MAYÚSCULA + NEGRITA...";

        resultsBox.innerHTML = "";

        detectedPrestations = [];

        const data =
            await extractPdfData(
                originalPdfBytes
            );

        const allFound = [];

        for(const page of data.pages){

            const found =
                findPrestationsInLine(
                    page.items
                );

            for(const item of found){

                allFound.push({
                    ...item,
                    pageNumber:
                        page.pageNumber
                });

            }
        }


        /*
           ELIMINAR DUPLICADOS.

           Una misma prestación puede ser detectada varias veces
           por los diferentes fragmentos del PDF.
        */

        const unique =
            new Map();

        for(const item of allFound){

            const key =
                item.pageNumber +
                "|" +
                item.code +
                "|" +
                normalizeText(item.originalText);

            if(!unique.has(key)){

                unique.set(
                    key,
                    item
                );

            }
        }

        detectedPrestations =
            Array.from(unique.values());


        /*
           ACTO BIOQUÍMICO

           Se agrega solamente si se encontró al menos
           una prestación de laboratorio.
        */

        if(
            detectedPrestations.length > 0
        ){

            const alreadyAct =
                detectedPrestations.some(
                    x =>
                        x.code === ACTO_BIOQUIMICO.code
                );

            if(!alreadyAct){

                detectedPrestations.unshift({

                    code:
                        ACTO_BIOQUIMICO.code,

                    description:
                        ACTO_BIOQUIMICO.description,

                    originalText:
                        ACTO_BIOQUIMICO.description,

                    pageNumber:1,

                    isActo:true

                });
            }
        }


        renderResults();


        if(detectedPrestations.length > 0){

            statusBox.className =
                "status ok";

            statusBox.textContent =
                "Análisis terminado.\n" +
                "Prestaciones MAYÚSCULA + NEGRITA encontradas: " +
                (detectedPrestations.length -
                    (
                        detectedPrestations.some(
                            x =>
                                x.code ===
                                ACTO_BIOQUIMICO.code
                        ) ? 1 : 0
                    )
                ) +
                ".\n\n" +
                "Se agregó el Acto Bioquímico " +
                ACTO_BIOQUIMICO.code +
                ".";

            generateBtn.disabled = false;

        }else{

            statusBox.className =
                "status warning";

            statusBox.textContent =
                "Análisis terminado.\n\n" +
                "No se encontró una prestación codificable con las reglas actuales.\n\n" +
                "IMPORTANTE: el sistema NO está buscando palabras sueltas. " +
                "Solo codifica nombres que aparezcan en MAYÚSCULA + NEGRITA " +
                "y coincidan con el nomenclador.";

            generateBtn.disabled = true;
        }

    }catch(error){

        console.error(error);

        statusBox.className =
            "status error";

        statusBox.textContent =
            "Error al analizar el PDF:\n\n" +
            error.message;

        generateBtn.disabled = true;

    }finally{

        loadingBox.style.display = "none";

    }
}


/* ============================================================
   MOSTRAR RESULTADOS
   ============================================================ */

function renderResults(){

    resultsBox.innerHTML = "";

    if(!detectedPrestations.length){
        return;
    }

    for(const item of detectedPrestations){

        const div =
            document.createElement("div");

        div.className = "result";

        div.innerHTML = `
            <div class="name">
                ${escapeHtml(item.description)}
            </div>

            <div class="code">
                Código: ${escapeHtml(item.code)}
            </div>

            ${
                item.pageNumber
                ?
                `<div class="page">
                    Página ${item.pageNumber}
                </div>`
                :
                ""
            }
        `;

        resultsBox.appendChild(div);
    }
}


/* ============================================================
   ESCAPAR HTML
   ============================================================ */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ============================================================
   SELECCIÓN DEL PDF
   ============================================================ */

pdfFile.addEventListener(
    "change",
    async function(){

        const file =
            this.files[0];

        if(!file){
            return;
        }

        if(
            file.type !== "application/pdf" &&
            !file.name.toLowerCase().endsWith(".pdf")
        ){

            statusBox.className =
                "status error";

            statusBox.textContent =
                "El archivo seleccionado no es un PDF.";

            analyzeBtn.disabled = true;

            return;
        }

        try{

            selectedFileName =
                file.name;

            originalPdfBytes =
                await file.arrayBuffer();

            /*
               Verificación real del PDF.

               Esto evita el error:
               "No PDF header found"
            */

            const bytes =
                new Uint8Array(
                    originalPdfBytes
                );

            const header =
                new TextDecoder()
                .decode(
                    bytes.slice(0,5)
                );

            if(header !== "%PDF-"){

                throw new Error(
                    "El archivo seleccionado no contiene un encabezado PDF válido."
                );

            }

            statusBox.className =
                "status ok";

            statusBox.textContent =
                "PDF cargado correctamente:\n" +
                file.name +
                "\n\nListo para analizar.";

            analyzeBtn.disabled = false;

            generateBtn.disabled = true;

            resultsBox.innerHTML = "";

            detectedPrestations = [];

        }catch(error){

            console.error(error);

            originalPdfBytes = null;

            analyzeBtn.disabled = true;

            statusBox.className =
                "status error";

            statusBox.textContent =
                "No se pudo cargar el PDF:\n\n" +
                error.message;

        }
    }
);


/* ============================================================
   BOTÓN ANALIZAR
   ============================================================ */

analyzeBtn.addEventListener(
    "click",
    analyzePDF
);


/* ============================================================
   GENERAR PDF
   ============================================================ */

generateBtn.addEventListener(
    "click",
    async function(){

        if(!originalPdfBytes){
            return;
        }

        if(!detectedPrestations.length){
            return;
        }

        try{

            loadingBox.style.display = "block";

            statusBox.className =
                "status";

            statusBox.textContent =
                "Generando PDF codificado...";


            /*
               Cargar PDF ORIGINAL.

               IMPORTANTE:
               Utilizamos directamente los bytes originales.
               No reconstruimos el PDF desde cero.

               Esto evita el error:
               "No PDF header found"
            */

            const pdfDoc =
                await PDFLib.PDFDocument.load(
                    originalPdfBytes
                );

            const pages =
                pdfDoc.getPages();


            /*
               Fuente estándar.
            */

            const font =
                await pdfDoc.embedFont(
                    PDFLib.StandardFonts.HelveticaBold
                );


            /*
               Para cada prestación encontrada,
               dibujar el código junto al nombre.
            */

            for(const item of detectedPrestations){

                /*
                   El Acto Bioquímico no estaba físicamente
                   en el PDF, por lo que no se dibuja sobre
                   ninguna prestación.

                   Se informa en el listado.
                */

                if(item.isActo){
                    continue;
                }

                const page =
                    pages[item.pageNumber - 1];

                if(!page){
                    continue;
                }

                const transform =
                    item.item &&
                    item.item.transform;

                if(!transform){
                    continue;
                }

                /*
                   Coordenadas PDF.js:

                   transform[4] = X
                   transform[5] = Y

                   PDF-lib usa origen abajo.

                   Ajustamos la coordenada Y.
                */

                const x =
                    Number(transform[4]) || 0;

                const yPdfJs =
                    Number(transform[5]) || 0;

                const pageHeight =
                    page.getHeight();

                /*
                   Tamaño de letra.
                */

                let fontSize =
                    Math.abs(
                        Number(transform[3]) || 10
                    );

                if(fontSize < 6){
                    fontSize = 8;
                }

                if(fontSize > 18){
                    fontSize = 12;
                }


                /*
                   El código aparece ligeramente
                   a la derecha del texto detectado.
                */

                const textWidth =
                    item.item.width || 0;

                const codeX =
                    x +
                    Number(textWidth) +
                    8;

                const codeY =
                    pageHeight -
                    yPdfJs -
                    fontSize;


                page.drawText(
                    item.code,
                    {
                        x:codeX,
                        y:codeY,

                        size:
                            Math.max(
                                7,
                                Math.min(
                                    fontSize,
                                    11
                                )
                            ),

                        font:font,

                        /*
                           Se utiliza un fondo blanco
                           para que el código sea legible.
                        */

                        color:
                            PDFLib.rgb(
                                0,
                                0,
                                0
                            )
                    }
                );

            }


            /*
               Guardar PDF.
            */

            const outputBytes =
                await pdfDoc.save();


            /*
               Crear archivo descargable.
            */

            const blob =
                new Blob(
                    [outputBytes],
                    {
                        type:"application/pdf"
                    }
                );

            const url =
                URL.createObjectURL(blob);

            const a =
                document.createElement("a");

            a.href = url;

            const originalName =
                selectedFileName
                .replace(
                    /\.pdf$/i,
                    ""
                );

            a.download =
                originalName +
                "_CODIFICADO.pdf";

            document.body.appendChild(a);

            a.click();

            a.remove();

            setTimeout(
                () => URL.revokeObjectURL(url),
                2000
            );


            statusBox.className =
                "status ok";

            statusBox.textContent =
                "PDF codificado generado correctamente.\n\n" +
                "Se mantuvo el PDF original y se agregaron " +
                "los códigos detectados.";


        }catch(error){

            console.error(error);

            statusBox.className =
                "status error";

            statusBox.textContent =
                "Error al generar PDF:\n\n" +
                error.message;

        }finally{

            loadingBox.style.display = "none";

        }
    }
);


/* ============================================================
   LIMPIAR
   ============================================================ */

clearBtn.addEventListener(
    "click",
    function(){

        pdfFile.value = "";

        originalPdfBytes = null;

        analyzedPdf = null;

        detectedPrestations = [];

        selectedFileName = "";

        analyzeBtn.disabled = true;

        generateBtn.disabled = true;

        resultsBox.innerHTML = "";

        statusBox.className =
            "status";

        statusBox.textContent =
            "Esperando que selecciones un PDF.";

    }
);
