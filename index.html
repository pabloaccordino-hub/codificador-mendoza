<title>Codificador de Prestaciones</title>

<style>
*{
    box-sizing:border-box
}

body{
    margin:0;
    background:#f3f4f6;
    color:#111827;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif
}

main{
    max-width:900px;
    margin:auto;
    padding:16px
}

.card{
    background:#fff;
    border-radius:18px;
    padding:18px;
    margin:12px 0;
    box-shadow:0 3px 15px #0001
}

h1{
    font-size:24px;
    margin:0
}

h2{
    margin-top:0
}

.muted,
.small{
    color:#6b7280
}

.small{
    font-size:13px
}

input[type=file]{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:12px;
    background:#fff
}

button{
    border:0;
    border-radius:12px;
    padding:13px 16px;
    background:#111827;
    color:white;
    font-weight:750;
    font-size:15px;
    margin-top:10px;
    width:100%;
    cursor:pointer
}

button.secondary{
    background:#e5e7eb;
    color:#111827
}

button:disabled{
    opacity:.5;
    cursor:not-allowed
}

.status{
    padding:12px;
    border-radius:12px;
    background:#f9fafb;
    margin-top:12px;
    white-space:pre-wrap
}

.ok{
    background:#ecfdf5;
    color:#065f46
}

.warn{
    background:#fffbeb;
    color:#92400e
}

.err{
    background:#fef2f2;
    color:#991b1b
}

.item{
    padding:14px 0;
    border-bottom:1px solid #e5e7eb
}

.item:last-child{
    border-bottom:0
}

.code{
    font-weight:900;
    font-size:17px
}

.badge{
    display:inline-block;
    padding:3px 8px;
    border-radius:999px;
    background:#eef2ff;
    font-size:12px;
    font-weight:800
}

.manual{
    background:#fff7ed;
    border:1px solid #fed7aa;
    padding:12px;
    border-radius:12px;
    margin-top:8px
}

.acto{
    background:#ecfdf5;
    border:1px solid #a7f3d0;
    padding:12px;
    border-radius:12px;
    margin:12px 0
}

.progress{
    height:8px;
    background:#e5e7eb;
    border-radius:999px;
    overflow:hidden;
    margin-top:10px
}

.progress div{
    height:100%;
    width:0%;
    background:#111827;
    transition:.2s
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

</head>

<body>

<main>

<section class="card">

<h1>Codificador de Prestaciones</h1>

<div class="muted">
Nomenclador Mendoza · Marzo 2026
</div>

</section>


<section class="card">

<b>Seleccioná el estudio médico en PDF</b>

<input
    id="pdf"
    type="file"
    accept="application/pdf"
    style="margin-top:10px"
>

<button onclick="analizar()">
ANALIZAR ESTUDIO
</button>

<button
    class="secondary"
    onclick="location.reload()"
>
LIMPIAR
</button>

<div
    id="status"
    class="status"
>
Esperando PDF…
</div>

<div class="progress">
    <div id="progressBar"></div>
</div>

</section>


<section
    id="resultado"
    class="card"
    style="display:none"
>

<h2>Resultado</h2>

<div id="aviso"></div>

<div id="lista"></div>

<button
    id="generar"
    onclick="generarPDF()"
>
GENERAR PDF CODIFICADO
</button>

</section>

</main>

/* =========================================================
   ACTO BIOQUÍMICO
   ========================================================= */

const ACTO_BIOQUIMICO = {

    description:"Acto Bioquímico",
    code:"LAB.00.001",
    confidence:"REGLA"

};


/* =========================================================
   VARIABLES
   ========================================================= */

let sourceBytes = null;

let sourceName = "ESTUDIO.pdf";

let detections = [];

let allText = [];

let pagesData = [];

let hayLaboratorio = false;


/* =========================================================
   NORMALIZAR TEXTO
   ========================================================= */

function norm(s){

    return String(s || "")

        .normalize("NFD")

        .replace(/[\u0300-\u036f]/g,"")

        .toUpperCase()

        .replace(/[^A-Z0-9Ñ .,/()\-]/g," ")

        .replace(/\s+/g," ")

        .trim();

}


/* =========================================================
   NORMALIZACIÓN MÁS AGRESIVA
   ========================================================= */

function normStrong(s){

    return norm(s)

        .replace(/\bEN\b/g," ")

        .replace(/\bDE\b/g," ")

        .replace(/\bLA\b/g," ")

        .replace(/\bEL\b/g," ")

        .replace(/\bLOS\b/g," ")

        .replace(/\bLAS\b/g," ")

        .replace(/\s+/g," ")

        .trim();

}


/* =========================================================
   PALABRAS
   ========================================================= */

function words(s){

    return normStrong(s)

        .split(" ")

        .filter(x => x.length >= 2);

}


/* =========================================================
   SIMILITUD
   ========================================================= */

function sim(a,b){

    const A = new Set(words(a));

    const B = new Set(words(b));

    if(!A.size || !B.size){

        return 0;

    }

    let comunes = 0;

    for(const x of A){

        if(B.has(x)){

            comunes++;

        }

    }

    return comunes / Math.max(A.size,B.size);

}


/* =========================================================
   COINCIDENCIA EXACTA
   ========================================================= */

function exact(s){

    const n = norm(s);

    if(EQUIV[n]){

        return EQUIV[n];

    }

    if(!Array.isArray(LAB_CODES)){

        return null;

    }

    for(const item of LAB_CODES){

        if(norm(item.description) === n){

            return {

                description:item.description,

                code:item.code,

                confidence:"EXACTA"

            };

        }

    }

    return null;

}


/* =========================================================
   COINCIDENCIA PARCIAL
   ========================================================= */

function fuzzy(s){

    if(!Array.isArray(LAB_CODES)){

        return null;

    }

    let mejor = null;

    let mejorScore = 0;

    const texto = normStrong(s);

    for(const item of LAB_CODES){

        const descripcion = normStrong(item.description);

        if(!descripcion){

            continue;

        }

        let score = sim(texto,descripcion);

        /*
           Bonus si una descripción está contenida
        */

        if(
            texto.length > 5 &&
            descripcion.includes(texto)
        ){

            score += .20;

        }

        if(
            descripcion.length > 5 &&
            texto.includes(descripcion)
        ){

            score += .20;

        }

        if(score > mejorScore){

            mejorScore = score;

            mejor = item;

        }

    }

    if(mejor && mejorScore >= .55){

        return {

            description:mejor.description,

            code:mejor.code,

            confidence:
                mejorScore >= .80
                ? "PROBABLE"
                : "REVISAR"

        };

    }

    return null;

}


/* =========================================================
   BUSCAR PRESTACIÓN
   ========================================================= */

function buscarPrestacion(texto){

    if(!texto){

        return null;

    }

    const e = exact(texto);

    if(e){

        return e;

    }

    return fuzzy(texto);

}


/* =========================================================
   OBTENER LÍNEAS DEL PDF
   ========================================================= */

function obtenerLineas(items){

    const lineas = [];

    for(const item of items){

        if(
            !item.str ||
            !item.str.trim()
        ){

            continue;

        }

        const x = item.transform[4];

        const y = item.transform[5];

        let linea = null;

        for(const l of lineas){

            if(Math.abs(l.y-y) < 4){

                linea = l;

                break;

            }

        }

        if(!linea){

            linea = {

                y:y,

                items:[]

            };

            lineas.push(linea);

        }

        linea.items.push({

            texto:item.str,

            x:x,

            item:item

        });

    }


    return lineas

        .map(l => {

            l.items.sort(
                (a,b) => a.x-b.x
            );

            const texto =
                l.items
                    .map(x => x.texto)
                    .join(" ")
                    .replace(/\s+/g," ")
                    .trim();

            return {

                text:texto,

                x:l.items[0]
                    ? l.items[0].x
                    : 20,

                y:l.y

            };

        })

        .filter(x => x.text);

}


/* =========================================================
   EVITAR DETECCIONES DUPLICADAS
   ========================================================= */

function eliminarDuplicados(){

    const vistos = new Set();

    detections = detections.filter(x => {

        const clave =
            x.page +
            "|" +
            norm(x.source) +
            "|" +
            x.code;

        if(vistos.has(clave)){

            return false;

        }

        vistos.add(clave);

        return true;

    });

}


/* =========================================================
   ANALIZAR
   ========================================================= */

async function analizar(){

    const input =
        document.getElementById("pdf");

    const status =
        document.getElementById("status");

    const progress =
        document.getElementById("progressBar");

    const file =
        input.files[0];


    if(!file){

        status.textContent =
            "Seleccioná un PDF.";

        status.className =
            "status warn";

        return;

    }


    if(
        file.type &&
        file.type !== "application/pdf"
    ){

        status.textContent =
            "El archivo seleccionado no parece ser un PDF.";

        status.className =
            "status err";

        return;

    }


    try{

        sourceName = file.name;

        sourceBytes =
            new Uint8Array(
                await file.arrayBuffer()
            );

        detections = [];

        allText = [];

        pagesData = [];

        hayLaboratorio = false;


        progress.style.width = "0%";


        status.textContent =
            "Abriendo PDF…";

        status.className =
            "status";


        /*
           Verificación real del encabezado PDF.
        */

        const encabezado =
            new TextDecoder()
                .decode(
                    sourceBytes.slice(0,20)
                );


        if(
            !encabezado.startsWith("%PDF")
        ){

            throw new Error(
                "El archivo seleccionado no contiene un encabezado PDF válido."
            );

        }


        const pdf =
            await pdfjsLib
                .getDocument({
                    data:sourceBytes
                })
                .promise;


        status.textContent =
            "Analizando " +
            pdf.numPages +
            " página(s)…";


        for(
            let numeroPagina=1;
            numeroPagina<=pdf.numPages;
            numeroPagina++
        ){

            const page =
                await pdf.getPage(numeroPagina);


            const tc =
                await page.getTextContent();


            const lineas =
                obtenerLineas(tc.items);


            pagesData.push({

                page:numeroPagina,

                lines:lineas

            });


            /*
               Guardamos todo el texto.
            */

            for(const linea of lineas){

                allText.push({

                    page:numeroPagina,

                    text:linea.text,

                    x:linea.x,

                    y:linea.y

                });

            }


            /*
               AHORA NO IMPORTA SI ESTÁ:

               MAYÚSCULA
               minúscula
               negrita
               normal
               etc.
            */

            for(const linea of lineas){

                const texto =
                    linea.text.trim();


                if(texto.length < 3){

                    continue;

                }


                const resultado =
                    buscarPrestacion(texto);


                if(resultado){

                    detections.push({

                        page:numeroPagina,

                        source:texto,

                        description:
                            resultado.description,

                        code:
                            resultado.code,

                        confidence:
                            resultado.confidence,

                        x:linea.x,

                        y:linea.y

                    });


                    if(
                        String(resultado.code)
                            .startsWith("LAB.")
                    ){

                        hayLaboratorio = true;

                    }

                }

            }


            progress.style.width =
                Math.round(
                    numeroPagina /
                    pdf.numPages *
                    100
                ) + "%";

        }


        /*
           ELIMINAR DUPLICADOS
        */

        eliminarDuplicados();


        /*
           ACTO BIOQUÍMICO
        */

        if(
            hayLaboratorio &&
            !detections.some(
                x => x.code === "LAB.00.001"
            )
        ){

            detections.unshift({

                page:1,

                source:"ACTO BIOQUÍMICO",

                description:
                    "Acto Bioquímico",

                code:"LAB.00.001",

                confidence:"REGLA",

                x:20,

                y:30

            });

        }


        status.textContent =
            "Análisis terminado. " +
            detections.length +
            " prestación(es) detectada(s).";


        status.className =
            detections.length
            ? "status ok"
            : "status warn";


        document
            .getElementById("resultado")
            .style.display="block";


        render();


    }catch(error){

        console.error(error);


        status.textContent =
            "ERROR AL ANALIZAR PDF:\n" +
            error.message;


        status.className =
            "status err";


        document
            .getElementById("resultado")
            .style.display="block";


        document
            .getElementById("lista")
            .innerHTML =
                '<div class="status err">' +
                '<b>No se pudo analizar el PDF.</b><br><br>' +
                esc(error.message) +
                '</div>';

    }

}


/* =========================================================
   MOSTRAR RESULTADO
   ========================================================= */

function render(){

    const aviso =
        document.getElementById("aviso");

    const lista =
        document.getElementById("lista");

    const generar =
        document.getElementById("generar");


    /*
       YA NO MOSTRAMOS:

       "Prestaciones MAYÚSCULA + NEGRITA"
    */


    if(hayLaboratorio){

        aviso.innerHTML =

            '<div class="acto">' +

            '<b>ACTO BIOQUÍMICO</b><br>' +

            'Código: ' +

            '<strong>LAB.00.001</strong>' +

            '<br>' +

            '<span class="small">' +

            'Agregado automáticamente por tratarse de prestaciones de laboratorio.' +

            '</span>' +

            '</div>';

    }else{

        aviso.innerHTML = "";

    }


    if(!detections.length){

        lista.innerHTML =

            '<div class="status warn">' +

            '<b>No se encontraron coincidencias automáticas.</b>' +

            '<br><br>' +

            'El PDF fue leído, pero ninguna línea coincidió suficientemente con el nomenclador cargado.' +

            '</div>';

        generar.disabled = true;

        return;

    }


    lista.innerHTML = detections.map(x => {

        let clase = "";

        if(
            x.confidence === "REVISAR"
        ){

            clase = "manual";

        }


        return (

            '<div class="item ' +
            clase +
            '">' +

            '<b>' +
            esc(x.source) +
            '</b>' +

            '<br>' +

            '→ ' +
            esc(x.description) +

            '<br>' +

            '<span class="code">' +
            esc(x.code) +
            '</span>' +

            '<br>' +

            '<span class="small">' +

            'Página ' +
            x.page +

            ' · ' +

            '<span class="badge">' +
            esc(x.confidence) +
            '</span>' +

            '</span>' +

            '</div>'

        );

    }).join("");


    generar.disabled =
        detections.length === 0;

}


/* =========================================================
   ESCAPAR HTML
   ========================================================= */

function esc(s){

    return String(s)

        .replace(
            /[&<>"']/g,

            m => ({

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[m])

        );

}


/* =========================================================
   GENERAR PDF
   ========================================================= */

async function generarPDF(){

    const status =
        document.getElementById("status");

    const boton =
        document.getElementById("generar");


    if(!sourceBytes){

        status.textContent =
            "Primero seleccioná y analizá un PDF.";

        status.className =
            "status warn";

        return;

    }


    try{

        boton.disabled = true;

        status.textContent =
            "Generando PDF codificado…";

        status.className =
            "status";


        /*
           VERIFICACIÓN
        */

        const header =
            new TextDecoder()
                .decode(
                    sourceBytes.slice(0,20)
                );


        if(
            !header.startsWith("%PDF")
        ){

            throw new Error(
                "El archivo original no contiene un encabezado PDF válido."
            );

        }


        /*
           CARGAR PDF
        */

        const doc =
            await PDFLib.PDFDocument.load(
                sourceBytes,
                {
                    ignoreEncryption:false
                }
            );


        /*
           FUENTE
        */

        const font =
            await doc.embedFont(
                PDFLib.StandardFonts.HelveticaBold
            );


        /*
           COLOCAR CÓDIGOS
        */

        for(const x of detections){

            /*
               No dibujar dos veces el acto bioquímico
               si hay varios laboratorios.
            */

            const page =
                doc.getPage(
                    x.page - 1
                );


            const width =
                page.getWidth();

            const height =
                page.getHeight();


            /*
               PDF.js y PDF-lib utilizan sistemas
               de coordenadas diferentes.

               Ajustamos la posición.
            */

            let posX =
                Number(x.x) || 20;


            let posY =
                height -
                (Number(x.y) || 20);


            /*
               Evitar que el código salga de la página.
            */

            if(posX < 10){

                posX = 10;

            }


            if(posY < 10){

                posY = 10;

            }


            if(posX > width - 130){

                posX =
                    width - 130;

            }


            /*
               Código.
            */

            page.drawText(

                " [" +
                x.code +
                "]",

                {

                    x:posX,

                    y:posY,

                    size:8,

                    font:font

                }

            );

        }


        /*
           GUARDAR
        */

        const bytes =
            await doc.save();


        /*
           CREAR BLOB
        */

        const blob =
            new Blob(
                [bytes],
                {
                    type:"application/pdf"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const a =
            document.createElement("a");


        a.href = url;


        a.download =
            sourceName
                .replace(
                    /\.pdf$/i,
                    ""
                ) +
            "_CODIFICADO.pdf";


        document.body.appendChild(a);


        a.click();


        document.body.removeChild(a);


        setTimeout(

            () => {

                URL.revokeObjectURL(url);

            },

            10000

        );


        status.textContent =
            "PDF codificado generado correctamente.";

        status.className =
            "status ok";


    }catch(error){

        console.error(error);


        status.textContent =
            "Error al generar PDF:\n" +
            error.message;

        status.className =
            "status err";


    }finally{

        boton.disabled = false;

    }

}
