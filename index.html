*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:820px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 15px #0001}

.ok{background:#ecfdf5;color:#065f46}.warn{background:#fffbeb;color:#92400e}.err{background:#fef2f2;color:#991b1b}
.item{padding:13px 0;border-bottom:1px solid #e5e7eb}.item:last-child{border-bottom:0}.code{font-weight:900}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2ff;font-size:12px;font-weight:800}
</style>

<b>Seleccioná el estudio médico en PDF</b>

<button onclick="analizar()">ANALIZAR ESTUDIO</button>
<button class="secondary" onclick="location.reload()">LIMPIAR</button>
<div id="status" class="status">Esperando PDF…</div>
</section>

</section>

let sourceBytes=null, sourceName="ESTUDIO.pdf", detections=[], ocrOnly=false;

function norm(s){
 return (s||"").normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").toUpperCase()
 .replace(/[^A-Z0-9Ñ .,/()\\-]/g," ").replace(/\\s+/g," ").trim();
}
function isUpper(s){
 const letters=(s||"").match(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/g)||[];
 if(letters.length<2)return false;
 return letters.filter(c=>c===c.toUpperCase()).length/letters.length>=.92;
}
function isBold(item,styles){
 const st=(styles&&styles[item.fontName])||{};
 const f=((st.fontFamily||"")+" "+(item.fontName||"")).toLowerCase();
 return /bold|black|heavy|semibold|demi|bd\\b/.test(f);
}
function exact(s){
 const n=norm(s);
 if(EQUIV[n])return EQUIV[n];
 const h=LAB_CODES.find(x=>norm(x.description)===n);
 return h?{description:h.description,code:h.code,confidence:"EXACTA"}:null;
}
function sim(a,b){
 const A=new Set(norm(a).split(" ")),B=new Set(norm(b).split(" "));
 let n=0;for(const x of A)if(B.has(x))n++;
 return n/Math.max(A.size,B.size);
}
function fuzzy(s){
 let best=null,score=0;
 for(const x of LAB_CODES){let q=sim(s,x.description);if(q>score){score=q;best=x}}
 return best&&score>=.78?{description:best.description,code:best.code,confidence:"PROBABLE"}:null;
}
function rowsFromText(items,styles){
 const rows=[];
 for(const it of items){
  if(!it.str||!it.str.trim())continue;
  const x=it.transform[4],y=it.transform[5];
  let r=rows.find(z=>Math.abs(z.y-y)<3);
  if(!r){r={y,items:[]};rows.push(r)}
  r.items.push({it,x});
 }
 return rows.map(r=>{
  r.items.sort((a,b)=>a.x-b.x);
  const text=r.items.map(z=>z.it.str).join(" ").replace(/\\s+/g," ").trim();
  const bold=r.items.filter(z=>isBold(z.it,styles)).length>=Math.max(1,Math.ceil(r.items.length*.6));
  return {text,bold,x:r.items[0].x,y:r.y};
 });
}
async function analizar(){
 const file=document.getElementById("pdf").files[0],st=document.getElementById("status");
 if(!file){st.textContent="Seleccioná un PDF.";st.className="status warn";return}
 sourceName=file.name;sourceBytes=new Uint8Array(await file.arrayBuffer());detections=[];ocrOnly=false;
 st.textContent="Leyendo PDF…";st.className="status";
 try{
  const pdf=await pdfjsLib.getDocument({data:sourceBytes}).promise;
  let anyText=false;
  for(let p=1;p<=pdf.numPages;p++){
   const page=await pdf.getPage(p),tc=await page.getTextContent();
   if(tc.items.length)anyText=true;
   for(const r of rowsFromText(tc.items,tc.styles)){
    if(!r.bold||!isUpper(r.text))continue;
    const h=exact(r.text)||fuzzy(r.text);
    if(h)detections.push({page:p,source:r.text,description:h.description,code:h.code,confidence:h.confidence,x:r.x,y:r.y});
   }
  }
  const seen=new Set();
  detections=detections.filter(x=>{let k=x.page+"|"+norm(x.source)+"|"+x.code;if(seen.has(k))return false;seen.add(k);return true});
  if(!anyText){
   ocrOnly=true;
   st.textContent="El PDF es un escaneo/imagen. Se puede hacer OCR, pero el OCR no conserva de forma fiable qué texto estaba en NEGRITA. Por seguridad, esta versión no codifica automáticamente un escaneo. Revisá el estudio o convertílo a PDF con texto seleccionable.";
   st.className="status warn";
  }else{
   st.textContent=`Análisis terminado. Prestaciones MAYÚSCULA + NEGRITA encontradas: ${detections.length}.`;
   st.className=detections.length?"status ok":"status warn";
  }
  document.getElementById("resultado").style.display="block";
  render();
 }catch(e){st.textContent="No se pudo leer el PDF: "+e.message;st.className="status err"}
}
function render(){
 const aviso=document.getElementById("aviso"),lista=document.getElementById("lista"),gen=document.getElementById("generar");
 if(ocrOnly){
  aviso.innerHTML='<div class="status warn"><b>REVISIÓN MANUAL NECESARIA.</b><br>El archivo no contiene texto estructurado; no se puede verificar la condición MAYÚSCULA + NEGRITA.</div>';
  lista.innerHTML="";gen.disabled=true;return;
 }
 if(detections.some(x=>x.code.startsWith("LAB."))){
  aviso.innerHTML='<div class="status warn"><b>LABORATORIO:</b> debe incluirse ACTO BIOQUÍMICO. La app no inventa un código para ese concepto hasta que esté confirmado en la tabla/regla de facturación.</div>';
 }else aviso.innerHTML="";
 lista.innerHTML=detections.length?detections.map(x=>`<div class="item"><b>${esc(x.source)}</b><br>→ ${esc(x.description)}<br><span class="code">${esc(x.code)}</span><br><span class="small">Página ${x.page} · <span class="badge">${x.confidence}</span></span></div>`).join(""):'<div class="status warn">No se encontró una prestación codificable con las reglas actuales.</div>';
 gen.disabled=!detections.length;
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function generarPDF(){
 const st=document.getElementById("status");st.textContent="Generando PDF…";
 try{
  const doc=await PDFLib.PDFDocument.load(sourceBytes),font=await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);
  for(const x of detections){
   const page=doc.getPage(x.page-1),h=page.getHeight();
   page.drawText(" ["+x.code+"]",{x:Math.min(x.x+180,page.getWidth()-145),y:Math.max(18,h-x.y-3),size:8,font});
  }
  const bytes=await doc.save(),url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));
  const a=document.createElement("a");a.href=url;a.download=sourceName.replace(/\\.pdf$/i,"")+"_CODIFICADO.pdf";a.click();
  setTimeout(()=>URL.revokeObjectURL(url),5000);st.textContent="PDF codificado generado.";st.className="status ok";
 }catch(e){st.textContent="Error al generar PDF: "+e.message;st.className="status err"}
}
