<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codificador de Prestaciones Bioquímicas - Mendoza</title>

<!-- Tesseract.js para OCR en PDFs escaneados / fotos -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<!-- PDF.js para lectura de PDFs digitales y renderizado de páginas para OCR -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<!-- PDF-Lib para modificar y generar PDFs -->
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 25px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #f8fafc; }
.container { max-width: 950px; margin: auto; background: #1e293b; padding: 32px; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); border: 1px solid #334155; }
h1 { margin: 0 0 6px; font-size: 26px; font-weight: 700; color: #f8fafc; }
.subtitle { color: #94a3b8; margin-bottom: 24px; font-size: 14px; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }
input[type="file"] { padding: 10px 14px; border: 1px solid #475569; border-radius: 8px; background: #0f172a; color: #f8fafc; font-size: 14px; cursor: pointer; flex: 1; }
button { border: 0; border-radius: 8px; padding: 12px 20px; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
#analyzeBtn { background: #3b82f6; color: white; }
#analyzeBtn:hover { background: #2563eb; }
#clearBtn { background: #334155; color: #cbd5e1; }
#clearBtn:hover { background: #475569; }
#downloadBtn { background: #10b981; color: white; }
#downloadBtn:hover { background: #059669; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.status { padding: 14px 18px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; margin-bottom: 20px; font-weight: 500; font-size: 14px; color: #38bdf8; min-height: 48px; display: flex; align-items: center; }
.ocr-notice { background: #7c2d12; border: 1px solid #ea580c; color: #ffedd5; padding: 10px 14px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; display: none; }
.results { border-top: 1px solid #334155; padding-top: 20px; }
.results h2 { font-size: 18px; margin-bottom: 14px; color: #f8fafc; display: flex; justify-content: space-between; align-items: center; }
.result-list { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; padding-right: 5px; }
.result-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; font-size: 14px; }
.result-name { font-weight: 500; color: #e2e8f0; }
.result-code { font-family: monospace; font-weight: 700; color: #38bdf8; background: #1e293b; padding: 4px 10px; border-radius: 6px; border: 1px solid #0284c7; }
#pdfPreview { width: 100%; height: 600px; border: 1px solid #475569; border-radius: 8px; margin-top: 24px; display: none; background: #ffffff; }
.progress-bar { width: 100%; height: 6px; background: #334155; border-radius: 3px; overflow: hidden; margin-top: 8px; display: none; }
.progress-fill { width: 0%; height: 100%; background: #38bdf8; transition: width 0.3s; }
</style>
</head>

<body>

<div class="container">
    <h1>Codificador de Prestaciones Bioquímicas</h1>
    <div class="subtitle">Nomenclador Mendoza · Motor Híbrido Texto + OCR Automático</div>

    <div class="controls">
        <input type="file" id="pdfInput" accept="application/pdf">
        <button id="analyzeBtn">🔍 ANALIZAR Y CODIFICAR</button>
        <button id="downloadBtn" disabled>💾 DESCARGAR PDF MODIFICADO</button>
        <button id="clearBtn">LIMPIAR</button>
    </div>

    <div id="status" class="status">Seleccioná un archivo PDF para comenzar.</div>
    <div id="progressBar" class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    <div id="ocrNotice" class="ocr-notice">⚠️ Documento escaneado detectado. Se ejecutó el lector OCR óptico para extraer las prestaciones.</div>

    <div class="results">
        <h2>
            <span>Prestaciones Detectadas</span>
            <span id="counterBadge" style="font-size: 13px; font-weight: normal; color: #94a3b8;"></span>
        </h2>
        <div id="resultsList" class="result-list">Esperando análisis...</div>
    </div>

    <iframe id="pdfPreview"></iframe>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

// Catálogo del Nomenclador con keywords ampliadas
const LAB_CATALOG = [
    {code:"LAB.00.001", description:"ACTO BIOQUIMICO", keywords: ["acto", "bioquimico", "laboratorio"]},
    {code:"LAB.01.012", description:"Bilirrubina directa", keywords: ["bilirrubina directa", "directa"]},
    {code:"LAB.01.013", description:"Bilirrubina en orina", keywords: ["bilirrubina en orina"]},
    {code:"LAB.01.014", description:"Bilirrubina total", keywords: ["bilirrubina total", "bilirrubina", "bilirrubinemia"]},
    {code:"LAB.01.040", description:"Creatinina en plasma o suero", keywords: ["creatinina", "creatininemia", "creat"]},
    {code:"LAB.01.060", description:"Ferremia (hierro en sangre) (Fe)", keywords: ["ferremia", "hierro", "fe serico"]},
    {code:"LAB.01.065", description:"Fosfatasa alcalina", keywords: ["fosfatasa alcalina", "fal", "alp"]},
    {code:"LAB.01.073", description:"Glucemia", keywords: ["glucemia", "glucosa", "glycemia"]},
    {code:"LAB.01.082", description:"Hematocrito", keywords: ["hematocrito", "hto"]},
    {code:"LAB.01.129", description:"Plaquetas, recuento de", keywords: ["plaquetas", "recuento de plaquetas", "plt"]},
    {code:"LAB.01.133", description:"Proteína C reactiva (PCR)", keywords: ["proteina c reactiva", "pcr", "crp"]},
    {code:"LAB.01.135", description:"Proteínas totales en plasma o suero", keywords: ["proteinas totales", "proteinemia"]},
    {code:"LAB.01.142", description:"Protrombina, tiempo de (TP)", keywords: ["protrombina", "tiempo de protrombina", "tp", "quick"]},
    {code:"LAB.02.035", description:"Hepatograma", keywords: ["hepatograma"]},
    {code:"LAB.02.054", description:"Nucleares, Ac. anti (ANA, FAN)", keywords: ["ana", "fan", "antinucleares"]},
    {code:"LAB.03.059", description:"CPK total (creatina fosfoquinasa)", keywords: ["cpk", "creatinfosfoquinasa", "ck"]},
    {code:"LAB.03.078", description:"Ferritina", keywords: ["ferritina"]},
    {code:"LAB.03.103", description:"Hemoglobina Glicosilada (HB A1C)", keywords: ["hemoglobina glicosilada", "hba1c", "hb a1c", "glicosilada"]},
    {code:"LAB.03.120", description:"HIV, Ac. anti (ELISA)", keywords: ["hiv", "sida", "vih"]},
    {code:"LAB.03.181", description:"Prolactina", keywords: ["prolactina", "prl"]}
];

let globalPdfFile = null;
let detectedCodes = [];
let modifiedPdfBlobUrl = null;
let modifiedPdfBytes = null;

function normalizeText(str) {
    return str.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
}

function updateProgress(percent) {
    const pBar = document.getElementById('progressBar');
    const pFill = document.getElementById('progressFill');
    if (percent >= 0 && percent <= 100) {
        pBar.style.display = 'block';
        pFill.style.width = percent + '%';
    } else {
        pBar.style.display = 'none';
    }
}

// Convertir página PDF a Canvas/Imagen para OCR
async function renderPageToCanvas(pdfPage) {
    const viewport = pdfPage.getViewport({ scale: 2.0 }); // Escala 2x para mejor nitidez en OCR
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    canvas.height = viewport.height;
    canvas.width = viewport.width;

    await pdfPage.render({ canvasContext: context, viewport: viewport }).promise;
    return canvas;
}

document.getElementById('analyzeBtn').addEventListener('click', async () => {
    const fileInput = document.getElementById('pdfInput');
    const status = document.getElementById('status');
    const ocrNotice = document.getElementById('ocrNotice');
    const resultsList = document.getElementById('resultsList');
    const counterBadge = document.getElementById('counterBadge');

    ocrNotice.style.display = 'none';
    document.getElementById('pdfPreview').style.display = 'none';
    document.getElementById('downloadBtn').disabled = true;

    if (!fileInput.files || !fileInput.files.length) {
        status.textContent = '⚠️ Por favor, seleccioná un archivo PDF primero.';
        return;
    }

    globalPdfFile = fileInput.files[0];
    status.textContent = '⏳ Cargando y leyendo documento...';
    updateProgress(10);

    try {
        const arrayBuffer = await globalPdfFile.arrayBuffer();
        const typedArray = new Uint8Array(arrayBuffer);
        const pdf = await pdfjsLib.getDocument({ data: typedArray }).promise;

        let fullText = '';

        // 1. Intentar extracción directa de texto
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join(' ');
            fullText += ' ' + pageText;
        }

        let cleanText = normalizeText(fullText).trim();

        // 2. Si no hay suficiente texto, ejecutar OCR con Tesseract
        if (cleanText.length < 15) {
            status.textContent = '🔍 No se detectó texto digital. Ejecutando motor OCR sobre la imagen...';
            ocrNotice.style.display = 'block';
            fullText = '';

            const worker = await Tesseract.createWorker('spa');

            for (let i = 1; i <= pdf.numPages; i++) {
                status.textContent = `👁️ Escaneando página ${i} de ${pdf.numPages} con OCR...`;
                updateProgress(20 + Math.floor((i / pdf.numPages) * 60));

                const page = await pdf.getPage(i);
                const canvas = await renderPageToCanvas(page);
                const { data: { text } } = await worker.recognize(canvas);
                fullText += ' ' + text;
            }

            await worker.terminate();
            cleanText = normalizeText(fullText).trim();
        }

        updateProgress(85);
        status.textContent = '⚙️ Identificando códigos de nomenclador...';

        // 3. Emparejamiento con el Nomenclador
        detectedCodes = [];
        // Siempre incluye Acto Bioquímico
        detectedCodes.push(LAB_CATALOG[0]);

        LAB_CATALOG.slice(1).forEach(item => {
            const match = item.keywords.some(kw => cleanText.includes(normalizeText(kw)));
            if (match) {
                detectedCodes.push(item);
            }
        });

        // Desduplicar prestaciones por código
        detectedCodes = detectedCodes.filter((item, index, self) =>
            index === self.findIndex(t => t.code === item.code)
        );

        // 4. Renderizar Lista de Resultados
        resultsList.innerHTML = '';
        detectedCodes.forEach(item => {
            const div = document.createElement('div');
            div.className = 'result-item';
            div.innerHTML = `<span class="result-name">${item.description}</span><span class="result-code">${item.code}</span>`;
            resultsList.appendChild(div);
        });

        counterBadge.textContent = `${detectedCodes.length} prestaciones codificadas`;

        // 5. Generar y Modificar el PDF agregando la hoja de resumen
        status.textContent = '📄 Anexando carátula de codificación al PDF original...';
        await generateAndInjectPdf(typedArray);

        updateProgress(100);
        setTimeout(() => updateProgress(-1), 1000);
        status.textContent = `✅ ¡Proceso completado con éxito! Se detectaron y estamparon ${detectedCodes.length} prestaciones.`;
        document.getElementById('downloadBtn').disabled = false;

    } catch (err) {
        console.error(err);
        updateProgress(-1);
        status.textContent = '❌ Error al procesar el documento. Verifica el archivo cargado.';
    }
});

// Función para insertar la página de codificación al inicio del PDF original
async function generateAndInjectPdf(originalBytes) {
    const pdfDoc = await PDFLib.PDFDocument.load(originalBytes);
    
    // Insertar la página de codificación al inicio (índice 0)
    const newPage = pdfDoc.insertPage(0, [595, 842]); // A4
    const fontBold = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
    const fontRegular = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);

    // Fondo / Encabezado
    newPage.drawRectangle({
        x: 0,
        y: 760,
        width: 595,
        height: 82,
        color: PDFLib.rgb(0.06, 0.09, 0.16)
    });

    newPage.drawText('AUDITORÍA BIOQUÍMICA - CODIFICACIÓN', {
        x: 40,
        y: 805,
        size: 16,
        font: fontBold,
        color: PDFLib.rgb(1, 1, 1)
    });

    newPage.drawText('Nomenclador Provincia de Mendoza · Anexo generado automáticamente', {
        x: 40,
        y: 780,
        size: 10,
        font: fontRegular,
        color: PDFLib.rgb(0.7, 0.8, 0.9)
    });

    // Detalle de fecha y resumen
    const now = new Date();
    const dateStr = now.toLocaleDateString('es-AR') + ' ' + now.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});

    newPage.drawText(`Fecha de liquidación: ${dateStr}`, { x: 40, y: 735, size: 9, font: fontRegular, color: PDFLib.rgb(0.3, 0.3, 0.3) });
    newPage.drawText(`Archivo: ${globalPdfFile.name}`, { x: 40, y: 720, size: 9, font: fontRegular, color: PDFLib.rgb(0.3, 0.3, 0.3) });

    newPage.drawLine({
        start: { x: 40, y: 705 },
        end: { x: 555, y: 705 },
        thickness: 1,
        color: PDFLib.rgb(0.85, 0.85, 0.85)
    });

    // Tabla de códigos
    let y = 675;

    newPage.drawText('CÓDIGO', { x: 50, y, size: 10, font: fontBold, color: PDFLib.rgb(0.2, 0.2, 0.2) });
    newPage.drawText('DESCRIPCIÓN DE LA PRESTACIÓN', { x: 160, y, size: 10, font: fontBold, color: PDFLib.rgb(0.2, 0.2, 0.2) });
    
    y -= 15;
    newPage.drawLine({ start: { x: 40, y }, end: { x: 555, y }, thickness: 0.5, color: PDFLib.rgb(0.7, 0.7, 0.7) });
    y -= 20;

    detectedCodes.forEach(item => {
        // Fondo alternado ligero
        newPage.drawRectangle({
            x: 40,
            y: y - 4,
            width: 515,
            height: 18,
            color: PDFLib.rgb(0.96, 0.97, 0.99)
        });

        newPage.drawText(item.code, { x: 50, y, size: 10, font: fontBold, color: PDFLib.rgb(0.01, 0.4, 0.8) });
        newPage.drawText(item.description, { x: 160, y, size: 10, font: fontRegular, color: PDFLib.rgb(0.1, 0.1, 0.1) });
        y -= 22;
    });

    // Pie de página de la carátula
    newPage.drawText('Nota: Este anexo se adjunta al estudio original sin modificar el contenido médico original.', {
        x: 40,
        y: 40,
        size: 8,
        font: fontRegular,
        color: PDFLib.rgb(0.5, 0.5, 0.5)
    });

    modifiedPdfBytes = await pdfDoc.save();
    const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
    modifiedPdfBlobUrl = URL.createObjectURL(blob);

    const iframe = document.getElementById('pdfPreview');
    iframe.src = modifiedPdfBlobUrl;
    iframe.style.display = 'block';
}

// Descargar el PDF Modificado al hacer clic
document.getElementById('downloadBtn').addEventListener('click', () => {
    if (!modifiedPdfBytes) return;

    const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `CODIFICADO_${globalPdfFile.name}`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
});

// Limpiar todo
document.getElementById('clearBtn').addEventListener('click', () => {
    document.getElementById('pdfInput').value = '';
    document.getElementById('resultsList').innerHTML = 'Esperando análisis...';
    document.getElementById('counterBadge').textContent = '';
    document.getElementById('status').textContent = 'Seleccioná un archivo PDF para comenzar.';
    document.getElementById('ocrNotice').style.display = 'none';
    document.getElementById('pdfPreview').style.display = 'none';
    document.getElementById('downloadBtn').disabled = true;
    updateProgress(-1);
    globalPdfFile = null;
    detectedCodes = [];
    modifiedPdfBlobUrl = null;
    modifiedPdfBytes = null;
});
</script>

</body>
</html>
